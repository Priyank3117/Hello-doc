<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Reset Password Page</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/Patient_ResetPassword.css" />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col col-lg-6 col-sm-12 main-img">
          <img src="images/11116016_415.jpg" alt="" class="img-fluid" />
        </div>
        <div class="col col-lg-6 col-sm-12 text-center right-side">
          <div class="dark-button float-end">
            <img
              src="images/dark_mode_black_24dp.svg"
              alt=""
              class="img-thumbnail"
            />
          </div>
          <!-- doct img -->
          <div class="logo mt-5">
            <img src="images/doct-logo.jpg" alt="" />
          </div>

          <!-- login form -->
          <div>
            <div class="text-info fs-5 mt-4 back">
              <img
                src="images/arrow_back_ios_FILL0_wght400_GRAD0_opsz24.svg"
                alt=""
                class="text-info"
              />
              <span>Back</span>
            </div>
            <h1>Reset your Password</h1>

            <div class="inp">
              <div class="form-floating d-flex mb-3 border rounded inps">
                <input
                  type="email"
                  class="form-control border-0 no-border"
                  id="floatingInput"
                  placeholder="name@example.com"
                />
                <img
                  src="images/user_circle.svg"
                  alt=""
                  class="pe-3 bg-white"
                />
                <label for="floatingInput">Username</label>
              </div>
            </div>
            <button class="btn btn-info text-white" type="button">
              Reset Password
            </button>
            <div class="text-center text-info fs-5 mt-3">
              <img
                src="images/arrow_back_ios_FILL0_wght400_GRAD0_opsz24.svg"
                alt=""
              />
              <span>Back to login</span>
            </div>
          </div>
          <footer class="text-muted">
            <span>Terms of condition |</span>
            <span>Privacy policy</span>
          </footer>

          <!-- ------------------- -->
        </div>
      </div>
    </div>
  </body>
</html>
